<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak — free text to speech</title>
<style>
:root{--bg:#f2f5f3;--panel:#fff;--ink:#13211b;--mute:#5a6c63;--line:#d5dfd9;--acc:#0f6b4f;--acc-ink:#fff;--hl:#c4ecd9;--wd:#ffe08a;--soft:#e9f0ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--panel:#14211b;--ink:#e6f1ea;--mute:#8da399;--line:#27382f;--acc:#4fd1a0;--acc-ink:#06241a;--hl:#1c4d3b;--wd:#7a6417;--soft:#1b2b23}}
:root[data-theme="dark"]{--bg:#0d1612;--panel:#14211b;--ink:#e6f1ea;--mute:#8da399;--line:#27382f;--acc:#4fd1a0;--acc-ink:#06241a;--hl:#1c4d3b;--wd:#7a6417;--soft:#1b2b23}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:16px 18px}
.brand{font-weight:700;font-size:1.3rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:1rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px;display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:.95rem;margin:0 0 12px;font-weight:700}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
label b{color:var(--ink)}
label span{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
select,input[type=search]{width:100%;padding:9px 10px;font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px}
input[type=range]{width:100%;accent-color:var(--acc)}
textarea{width:100%;min-height:340px;resize:vertical;padding:14px;font:inherit;font-size:1.05rem;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,.btn{font:inherit;font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;background:var(--panel);color:var(--ink)}
button:hover,.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-top:8px;flex-wrap:wrap;gap:6px}
#reader{display:none;min-height:340px;max-height:60vh;overflow:auto;font-size:1.1rem;line-height:1.8;padding:6px}
#reader s{text-decoration:none;cursor:pointer;border-radius:4px;padding:1px 0}
#reader s:hover{background:var(--soft)}
#reader s.on{background:var(--hl)}
#reader mark{background:var(--wd);color:inherit;border-radius:3px}
.player{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1.5px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.pin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ctl{display:flex;gap:8px}
.ctl button{width:42px;height:42px;padding:0;border-radius:50%;font-size:1rem}
.ctl button.main{width:50px;height:50px;background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.prog{flex:1;min-width:180px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.pt{font-size:.8rem;color:var(--mute);margin-top:4px}
.msg{color:#b3261e;font-size:.85rem;margin-top:8px;min-height:1em}
.hint{font-size:.78rem;color:var(--mute);margin-top:14px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">&#9835;</span>Speak</div>
  <button id="theme" aria-label="Toggle dark mode">Theme</button>
</header>

<div class="wrap">
  <section class="card" aria-label="Text">
    <div class="tools">
      <label class="btn" style="margin:0;color:var(--ink)">Open .txt<input id="file" type="file" accept=".txt,.md,text/plain" hidden></label>
      <button id="paste">Paste</button>
      <button id="sample">Sample</button>
      <button id="clear">Clear</button>
      <button id="edit" style="display:none">Edit text</button>
    </div>
    <textarea id="text" placeholder="Type, paste or drop a text file here."></textarea>
    <div id="reader" aria-live="off"></div>
    <div class="stats"><span id="st1">0 words</span><span id="st2">0 characters</span><span id="st3">~0 min</span></div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <aside class="card" aria-label="Settings">
    <h2>Voice settings</h2>
    <label for="vs"><b>Search voices</b></label>
    <input type="search" id="vs" placeholder="e.g. English, Hindi, Google">
    <label for="lang"><b>Language</b></label>
    <select id="lang"></select>
    <label for="voice"><b>Voice</b></label>
    <select id="voice"></select>
    <div class="hint" id="help"></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="auto" checked> <b>Auto-switch voice by script</b></label>
    <div class="hint">Mixed text (for example Hindi + Tamil + English) is read sentence by sentence with a matching voice.</div>
    <label for="rate"><b>Speed</b><span id="rv">1.0×</span></label>
    <input type="range" id="rate" min="0.5" max="2.5" step="0.1" value="1">
    <label for="pitch"><b>Pitch</b><span id="pv">1.0</span></label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
    <label for="vol"><b>Volume</b><span id="vv">100%</span></label>
    <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
    <button id="test" style="margin-top:14px;width:100%">Preview voice</button>
    <p class="hint">Shortcuts: Ctrl+Enter play or pause, Esc stop, Alt+←/→ previous or next sentence. Click any sentence while reading to jump to it.</p>
  </aside>
</div>

<div class="player">
  <div class="pin">
    <div class="ctl">
      <button id="prev" aria-label="Previous sentence" disabled>&#9198;</button>
      <button id="play" class="main" aria-label="Play">&#9654;</button>
      <button id="stop" aria-label="Stop" disabled>&#9632;</button>
      <button id="next" aria-label="Next sentence" disabled>&#9197;</button>
    </div>
    <div class="prog">
      <div class="bar"><i id="bar"></i></div>
      <div class="pt" id="pt">Ready</div>
    </div>
  </div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var synth=window.speechSynthesis;
var text=$("text"),reader=$("reader"),msg=$("msg"),playB=$("play"),stopB=$("stop"),prevB=$("prev"),nextB=$("next"),editB=$("edit");
var voiceSel=$("voice"),langSel=$("lang"),vs=$("vs"),rate=$("rate"),pitch=$("pitch"),vol=$("vol");
var cum=[0],voices=[],list=[],idx=0,state="idle",token=0,store={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

if(!synth){msg.textContent="This browser doesn't support speech. Use Chrome, Edge, Safari or Firefox.";playB.disabled=true;return;}

/* ---------- settings ---------- */
var th=lsGet("tts-theme"); if(th)document.documentElement.setAttribute("data-theme",th);
$("theme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  var n=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);lsSet("tts-theme",n);
};
["rate","pitch","vol"].forEach(function(k){var v=lsGet("tts-"+k);if(v)$(k).value=v;});
function labels(){$("rv").textContent=Number(rate.value).toFixed(1)+"×";$("pv").textContent=Number(pitch.value).toFixed(1);$("vv").textContent=Math.round(vol.value*100)+"%";}
labels();
[rate,pitch,vol].forEach(function(el){el.addEventListener("input",function(){labels();lsSet("tts-"+el.id,el.value);});
  el.addEventListener("change",function(){if(state==="playing")speakFrom(idx);});});

/* ---------- voices ---------- */
var INDIC=[["hi","Hindi (हिन्दी)"],["mr","Marathi (मराठी)"],["bn","Bengali (বাংলা)"],["ta","Tamil (தமிழ்)"],["te","Telugu (తెలుగు)"],["gu","Gujarati (ગુજરાતી)"],["kn","Kannada (ಕನ್ನಡ)"],["ml","Malayalam (മലയാളം)"],["pa","Punjabi (ਪੰਜਾਬੀ)"],["ur","Urdu (اردو)"],["or","Odia (ଓଡ଼ିଆ)"],["as","Assamese (অসমীয়া)"],["ne","Nepali (नेपाली)"],["sa","Sanskrit (संस्कृतम्)"],["en-IN","English (India)"]];
function lc(v){return v.lang.replace("_","-").toLowerCase();}
function pfx(v,p){return p.indexOf("-")>-1?lc(v)===p.toLowerCase():lc(v).split("-")[0]===p;}
function loadVoices(){
  voices=synth.getVoices(); if(!voices.length)return;
  var cur=langSel.value||lsGet("tts-lang")||"all",html='<option value="all">All languages ('+voices.length+' voices)</option><optgroup label="Indian languages">';
  INDIC.forEach(function(l){var n=voices.filter(function(v){return pfx(v,l[0])}).length;html+='<option value="p:'+l[0]+'">'+l[1]+(n?" — "+n+" voice"+(n>1?"s":""):" — not installed")+'</option>';});
  html+='</optgroup><optgroup label="All installed">';
  var langs={};voices.forEach(function(v){langs[v.lang]=1;});
  Object.keys(langs).sort().forEach(function(l){html+='<option value="'+l+'">'+l+'</option>';});
  langSel.innerHTML=html+'</optgroup>';
  langSel.value=cur;if(langSel.value!==cur)langSel.value="all";
  fillVoices();
}
function fillVoices(){
  var q=vs.value.toLowerCase(),l=langSel.value,saved=voiceSel.value||lsGet("tts-voice");
  voiceSel.innerHTML="";$("help").textContent="";
  voices.filter(function(v){return(l==="all"||(l.indexOf("p:")===0?pfx(v,l.slice(2)):v.lang===l))&&(!q||(v.name+" "+v.lang).toLowerCase().indexOf(q)>-1);})
   .forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")"+(v.localService?"":" · online");voiceSel.appendChild(o);});
  if(!voiceSel.options.length){
    voiceSel.innerHTML='<option value="">No matching voice</option>';
    if(l.indexOf("p:")===0)$("help").textContent="No voice for this language is installed on this device. Android: Settings › Language & input › Text-to-speech › Google Speech Services › Install voice data. Windows: Settings › Time & language › Speech › Add voices. iPhone/Mac: Settings › Accessibility › Spoken Content › Voices. Chrome on desktop also offers online Google voices for several Indian languages.";
    return;
  }
  var ok=Array.prototype.some.call(voiceSel.options,function(o){return o.value===saved;});
  if(ok)voiceSel.value=saved;
}
loadVoices();synth.onvoiceschanged=loadVoices;
vs.oninput=fillVoices;
langSel.onchange=function(){lsSet("tts-lang",langSel.value);fillVoices();};
voiceSel.onchange=function(){lsSet("tts-voice",voiceSel.value);if(state==="playing")speakFrom(idx);};

/* ---------- text ---------- */
var draft=lsGet("tts-draft");if(draft)text.value=draft;
function stats(){
  var t=text.value,w=(t.trim().match(/\S+/g)||[]).length;
  $("st1").textContent=w+" words";$("st2").textContent=t.length+" characters";
  var m=w/(160*Number(rate.value));$("st3").textContent="~"+(m<1?Math.max(1,Math.round(m*60))+" sec":Math.round(m)+" min");
}
text.addEventListener("input",function(){stats();lsSet("tts-draft",text.value);});
rate.addEventListener("input",stats);stats();
$("clear").onclick=function(){stopAll();text.value="";lsSet("tts-draft","");stats();text.focus();};
$("sample").onclick=function(){stopAll();text.value="Welcome to Speak. This is a free text to speech tool that runs entirely in your browser. Choose a voice on the right, adjust the speed, and press play. You can also click any sentence while it is reading to jump straight to it.";lsSet("tts-draft",text.value);stats();};
$("paste").onclick=function(){
  if(!navigator.clipboard||!navigator.clipboard.readText){msg.textContent="Clipboard access isn't available here. Use Ctrl+V in the text box.";return;}
  navigator.clipboard.readText().then(function(t){text.value=t;lsSet("tts-draft",t);stats();msg.textContent="";}).catch(function(){msg.textContent="Clipboard blocked. Use Ctrl+V in the text box.";});
};
function loadFile(f){
  if(!f)return;
  var r=new FileReader();r.onload=function(){stopAll();text.value=String(r.result);lsSet("tts-draft",text.value);stats();msg.textContent="";};r.readAsText(f);
}
$("file").onchange=function(e){loadFile(e.target.files[0]);e.target.value="";};
["dragover","drop"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();if(ev==="drop")loadFile(e.dataTransfer.files[0]);});});

/* ---------- split into sentences ---------- */
function split(t){
  var out=[];
  (t.replace(/\r/g,"").match(/[^.!?。！？।॥\n]+[.!?。！？।॥]*["')\]]*\s*|\n+/g)||[]).forEach(function(s){
    if(!s.trim())return;
    while(s.length>220){var c=s.lastIndexOf(",",220);if(c<60)c=s.lastIndexOf(" ",220);if(c<1)c=220;out.push(s.slice(0,c+1));s=s.slice(c+1);}
    if(s.trim())out.push(s);
  });
  return out;
}

/* ---------- playback ---------- */
var SCR=[[/[\u0900-\u097F]/,["hi","mr","ne","sa"]],[/[\u0980-\u09FF]/,["bn","as"]],[/[\u0A00-\u0A7F]/,["pa"]],[/[\u0A80-\u0AFF]/,["gu"]],[/[\u0B00-\u0B7F]/,["or"]],[/[\u0B80-\u0BFF]/,["ta"]],[/[\u0C00-\u0C7F]/,["te"]],[/[\u0C80-\u0CFF]/,["kn"]],[/[\u0D00-\u0D7F]/,["ml"]],[/[\u0600-\u06FF]/,["ur","ar"]]];
var warned={};
function pick(s){
  var base=voices.filter(function(x){return x.name===voiceSel.value})[0];
  if(!$("auto").checked)return base;
  for(var i=0;i<SCR.length;i++){if(!SCR[i][0].test(s))continue;
    var langs=SCR[i][1];
    if(base&&langs.indexOf(lc(base).split("-")[0])>-1)return base;
    for(var j=0;j<langs.length;j++){var m=voices.filter(function(v){return lc(v).split("-")[0]===langs[j]})[0];if(m)return m;}
    if(!warned[i]){warned[i]=1;msg.textContent="No installed voice for part of this text ("+langs[0]+"). See the install tips in the voice settings.";}
    return base;
  }
  return base;
}
function setUI(){
  var on=state!=="idle";
  stopB.disabled=prevB.disabled=nextB.disabled=!on;
  playB.innerHTML=state==="playing"?"&#10074;&#10074;":"&#9654;";
  playB.setAttribute("aria-label",state==="playing"?"Pause":"Play");
  text.style.display=on?"none":"block";reader.style.display=on?"block":"none";editB.style.display=on?"inline-block":"none";
}
function buildReader(){
  reader.innerHTML=list.map(function(s,i){return'<s data-i="'+i+'">'+esc(s)+'</s>';}).join("");
}
reader.addEventListener("click",function(e){var el=e.target.closest("s");if(el)speakFrom(Number(el.dataset.i));});
function progress(){
  var pct=list.length?(idx/list.length)*100:0;$("bar").style.width=pct+"%";
  var rem=(cum[list.length]-cum[idx])/(15*Number(rate.value)),m=Math.ceil(rem/60);
  $("pt").textContent=state==="idle"?"Ready":("Sentence "+(idx+1)+" of "+list.length+" · about "+(rem<60?Math.ceil(rem)+" sec":m+" min")+" left"+(state==="paused"?" · paused":""));
}
function mark(i){
  var prev=reader.querySelector("s.on");if(prev){prev.classList.remove("on");prev.textContent=list[Number(prev.dataset.i)];}
  var el=reader.querySelector('s[data-i="'+i+'"]');if(el){el.classList.add("on");el.scrollIntoView({block:"center",behavior:"smooth"});}
}
function speakFrom(i){
  synth.cancel();var my=++token;
  if(!list.length)return;
  idx=Math.max(0,Math.min(i,list.length-1));state="playing";setUI();progress();
  (function run(){
    if(my!==token)return;
    if(idx>=list.length){stopAll();return;}
    var s=list[idx],u=new SpeechSynthesisUtterance(s),base=idx,v=pick(s);
    if(v){u.voice=v;u.lang=v.lang;}
    u.rate=Number(rate.value);u.pitch=Number(pitch.value);u.volume=Number(vol.value);
    mark(idx);progress();var cur=reader.querySelector('s[data-i="'+base+'"]');
    u.onboundary=function(e){
      if(my!==token||(e.name&&e.name!=="word"))return;
      var el=cur;if(!el)return;
      var a=e.charIndex,b=s.indexOf(" ",a);if(b<0)b=s.length;
      el.innerHTML=esc(s.slice(0,a))+"<mark>"+esc(s.slice(a,b))+"</mark>"+esc(s.slice(b));
    };
    u.onend=function(){if(my!==token)return;idx++;run();};
    u.onerror=function(e){if(my!==token||e.error==="interrupted"||e.error==="canceled")return;msg.textContent="Speech error: "+e.error;stopAll();};
    synth.speak(u);
  })();
}
function stopAll(){token++;synth.cancel();state="idle";idx=0;setUI();progress();$("bar").style.width="0";}
function start(){
  var t=text.value.trim();if(!t){msg.textContent="Add some text first.";text.focus();return;}
  msg.textContent="";list=split(t);cum=[0];list.forEach(function(x){cum.push(cum[cum.length-1]+x.length)});buildReader();warned={};speakFrom(0);
}
function toggle(){
  if(state==="idle")start();
  else if(state==="playing"){synth.pause();state="paused";setUI();progress();}
  else{synth.resume();state="playing";setUI();progress();}
}
playB.onclick=toggle;stopB.onclick=stopAll;
prevB.onclick=function(){speakFrom(idx-1);};nextB.onclick=function(){speakFrom(idx+1);};
editB.onclick=stopAll;
$("test").onclick=function(){
  stopAll();var v=voices.filter(function(x){return x.name===voiceSel.value})[0];
  var u=new SpeechSynthesisUtterance("This is how I sound at the current settings.");
  if(v){u.voice=v;u.lang=v.lang;}u.rate=Number(rate.value);u.pitch=Number(pitch.value);u.volume=Number(vol.value);synth.speak(u);
};
document.addEventListener("keydown",function(e){
  if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();toggle();}
  else if(e.key==="Escape"&&state!=="idle")stopAll();
  else if(e.altKey&&e.key==="ArrowRight"&&state!=="idle")speakFrom(idx+1);
  else if(e.altKey&&e.key==="ArrowLeft"&&state!=="idle")speakFrom(idx-1);
});
window.addEventListener("beforeunload",function(){synth.cancel();});
})();
</script>
</body>
</html>
